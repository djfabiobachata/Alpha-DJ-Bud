<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha DJ Bud</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%239b5cff'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%233dff8f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rack">

  <!-- ===== HEADER ===== -->
  <header class="bar">
    <div class="logo" title="Alpha DJ Bud">ALPHA<span>DJ</span>BUD</div>
    <div class="lcd lcd-wide" id="statusLcd" data-i18n="status.starting">Starting…</div>
    <div class="leds">
      <div class="led-cell"><i class="led" id="ledDjay"></i><b>DJAY</b></div>
      <div class="led-cell" id="cellFader"><i class="led" id="ledFader"></i><b>FADER</b></div>
      <div class="led-cell"><i class="led purple" id="ledBrain"></i><b>BRAIN</b></div>
    </div>
    <div class="hdr-btns">
      <button class="hw update" id="btnUpdate" hidden></button>
      <button class="hw" id="btnSettings" data-i18n-title="hdr.settings">⚙</button>
      <button class="hw accent" id="btnCompact" data-i18n-title="hdr.mini">▣ MINI</button>
    </div>
  </header>

  <!-- ===== SETUP ===== -->
  <section class="panel setup">
    <h2 data-i18n="setup.title">NIGHT SETUP</h2>
    <label class="field" id="fieldEvent">
      <span data-i18n="setup.event">EVENT</span>
      <select id="selEvent"></select>
    </label>
    <div class="field">
      <span data-i18n="setup.genre">NOW PLAYING</span>
      <div class="seg" id="genreSeg"></div>
    </div>
    <label class="field">
      <span><span data-i18n="setup.playlist">FOLDER / PLAYLIST</span> <em id="poolCount"></em></span>
      <select id="selPlaylist"></select>
    </label>
    <div class="row-btns">
      <button class="hw" id="btnNewSet" data-i18n="setup.newSet" data-i18n-title="setup.newSetTip">NEW SET</button>
      <button class="hw accent" id="btnEndSet" data-i18n="setup.endSet" data-i18n-title="setup.endSetTip">END SET</button>
    </div>
  </section>

  <!-- ===== NOW PLAYING ===== -->
  <section class="panel now">
    <h2><span data-i18n="now.title">NOW PLAYING</span> <em id="nowSource"></em></h2>
    <div class="now-body">
      <div class="now-info">
        <div class="lcd lcd-track">
          <div class="t" id="nowTitle">—</div>
          <div class="a" id="nowArtist"></div>
        </div>
        <div class="readouts">
          <div class="readout"><span>KEY</span><div class="seg7" id="nowKey">--</div><small id="nowMusical"></small></div>
          <div class="readout"><span>BPM</span><div class="seg7" id="nowBpm">---</div><small id="nowDeck"></small></div>
        </div>
      </div>
      <div class="wheel-wrap"><svg id="wheel" viewBox="-110 -110 220 220"></svg></div>
    </div>
  </section>

  <!-- ===== SUGGESTIONS ===== -->
  <section class="panel next">
    <h2><span data-i18n="next.title">NEXT TRACKS</span> <em id="nextInfo"></em></h2>
    <div class="drag-hint" data-i18n="drag.title"></div>
    <div class="list" id="nextList"></div>
    <div class="filter-note" id="filterNote"></div>
  </section>

  <!-- ===== SIDE: BRAIN + HISTORY + SEARCH ===== -->
  <section class="panel side">
    <h2 data-i18n="brain.title">BUD BRAIN</h2>
    <div class="brain">
      <div class="knob-cell"><div class="knob" id="knobConf"><i></i></div><b data-i18n="brain.conf">CONFIDENCE</b><small id="brainConf">0%</small></div>
      <div class="knob-cell"><div class="knob" id="knobFollow"><i></i></div><b data-i18n="brain.followed">FOLLOWED</b><small id="brainFollow">0%</small></div>
      <div class="brain-txt" id="brainTxt"></div>
    </div>
    <button class="hw small" id="btnImport" data-i18n="brain.import" data-i18n-title="brain.importTip">LEARN FROM DJAY HISTORY</button>

    <h2 class="sub" data-i18n="side.set">CURRENT SET</h2>
    <ol class="played" id="playedList"></ol>

    <h2 class="sub" data-i18n="side.pick">PICK MANUALLY</h2>
    <input class="search" id="search" data-i18n-ph="side.search" placeholder="Search title or artist…" autocomplete="off">
    <div class="list mini" id="searchList"></div>
  </section>

  <footer class="bar foot">
    <div class="term" id="term" data-i18n="term"></div>
    <div class="brand">alpha dj bud · <span id="ver"></span></div>
  </footer>
</div>

<!-- ===== SETTINGS DIALOG ===== -->
<div class="modal" id="settings" hidden>
  <div class="panel dialog">
    <h2 data-i18n="set.title">SETTINGS</h2>
    <label class="opt"><span data-i18n="set.language">Language</span>
      <select id="optLang" class="lang-select">
        <option value="en">English</option>
        <option value="it">Italiano</option>
        <option value="es">Español</option>
      </select>
    </label>
    <label class="opt"><span data-i18n="det.title"></span>
      <select id="optDetection" class="lang-select">
        <option value="fader" data-i18n="det.fader"></option>
        <option value="history" data-i18n="det.history"></option>
      </select>
    </label>
    <p class="hint" data-i18n="det.hint"></p>
    <label class="opt"><span data-i18n="set.tol"></span><input type="number" min="0" max="20" step="0.5" id="optTol"></label>
    <label class="opt"><span data-i18n="set.artist"></span><input type="number" min="0" max="10" step="1" id="optArtist"></label>
    <label class="opt"><span data-i18n="set.variety"></span>
      <select id="optVariety" class="lang-select">
        <option value="0" data-i18n="var.0"></option>
        <option value="25" data-i18n="var.25"></option>
        <option value="50" data-i18n="var.50"></option>
        <option value="80" data-i18n="var.80"></option>
      </select>
    </label>
    <p class="hint" data-i18n="set.varietyHint"></p>
    <label class="opt"><span data-i18n="set.limit"></span><input type="number" min="3" max="50" step="1" id="optLimit"></label>
    <label class="opt chk"><input type="checkbox" id="optTritone"><span data-i18n="set.tritone"></span></label>
    <label class="opt chk"><input type="checkbox" id="optHalf"><span data-i18n="set.half"></span></label>
    <label class="opt chk"><input type="checkbox" id="optReplays"><span data-i18n="set.replays"></span></label>
    <label class="opt chk"><input type="checkbox" id="optComments"><span data-i18n="set.comments"></span></label>
    <label class="opt chk"><input type="checkbox" id="optAutoGenre"><span data-i18n="set.autoGenre"></span></label>
    <label class="opt col"><span data-i18n="set.db"></span><input type="text" id="optDb" placeholder="~/Music/djay/djay Media Library.djayMediaLibrary"></label>
    <div class="dbinfo" id="dbInfo"></div>
    <h2 class="sub" data-i18n="upd.title"></h2>
    <label class="opt chk"><input type="checkbox" id="optAutoUpdate"><span data-i18n="upd.auto"></span></label>
    <div class="opt"><span class="dbinfo" id="updInfo"></span><button class="hw small" style="width:auto" id="btnCheckUpdate" data-i18n="upd.checkNow"></button></div>
    <div class="row-btns">
      <button class="hw" id="btnCloseSettings" data-i18n="set.cancel">CANCEL</button>
      <button class="hw accent" id="btnSaveSettings" data-i18n="set.save">SAVE</button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
